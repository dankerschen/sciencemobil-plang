<style>
/* Colours follow the Naturmusée site: dark teal, off-white, mint, lavender, coral */
:root{--head:#00262A;--head-ink:#FFFFFD;--hot:#DF3234;--bg:#F3F3F1;--card:#FFFFFD;--ink:#1D1D1B;--mute:#5E6866;--line:#DFDFDA;--accent:#00262A;--accent-ink:#FFFFFD;--soft:#DCECDB;--warn:#B8292B;--warn-bg:#FCE7E6;--today:#EEECF5;--today-line:#8E86D6}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top) + 8px) 12px 10px}

#status.off{color:#FC6365}
header .icon,header .chip,header .tab{background:rgba(255,255,253,.08);border-color:rgba(255,255,253,.28);color:var(--head-ink)}
header .chip.on{background:var(--hot);border-color:var(--hot);color:#FFFFFD}

.addev{width:100%;margin:8px 0;border:1px dashed var(--accent);background:none;border-radius:10px;padding:8px;color:var(--accent);cursor:pointer;font-weight:600}
.evform label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.evform input[type=text],.evform input[type=date],.evform input[type=time]{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.evform .row{display:flex;gap:8px}.evform .row label{flex:1}
.evform .chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:15px}

.evform .primary{background:var(--hot);color:#FFFFFD;border-color:var(--hot)}
.sheetbox{max-height:92vh;overflow:auto}
button{font:inherit;color:inherit}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer}

.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-top:4px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);padding:7px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--soft);border-color:var(--accent);font-weight:600}
#q{width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
main{padding:10px 12px 40px;max-width:760px;margin:0 auto}
.wk{margin:16px 0 6px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.wk small{color:var(--mute);font-weight:500}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}

.login .icon{background:var(--hot);color:#FFFFFD;border-color:var(--hot);padding:10px;font-weight:700}
.err{color:var(--warn);font-weight:600}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:24px;line-height:1.9}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);color:var(--ink);width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.sheetbox .icon{padding:11px;font-weight:600;font-size:16px}
.sheetbox .link{margin-top:4px;align-self:center}
.sheetbox a.icon{text-decoration:none;text-align:center;color:inherit}
.link{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}
.calbtns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.calbtns .icon{text-decoration:none;color:var(--ink);font-size:13px}
.pin{border:1px dashed var(--line);background:none;border-radius:8px;padding:1px 7px;margin-left:6px;font-size:12px;color:var(--mute);cursor:pointer}
.addr{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--mute)}
.addr .link{font-size:12px;color:var(--mute)}
.navbtn{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:4px 11px 4px 9px;border-radius:999px;background:var(--hot);color:#FFFFFD;font-size:13px;font-weight:700;text-decoration:none;vertical-align:middle;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.navbtn svg{width:15px;height:15px;fill:currentColor}
.navbtn:active{transform:scale(.96)}
.notice{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--mute)}
.notice.hol{border:1px solid var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.notice.warn{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="top"><h1><img src="icon.svg" alt="">ScienceMobil-Plang</h1><button class="icon" id="refresh" aria-label="Aktualiséieren" title="Aktualiséieren">↻</button></div>
  <div id="status">Lueden…</div>

<main id="app"><div class="empty">Lueden…</div></main>

<script>
/* ======================= CONFIG ======================= */
const CONFIG = {
  // This file is public (GitHub Pages): no data, no sheet address, no passwords in here.
  // The data comes from the Cloudflare Worker (ics/feed.js), which checks each guide's password;
  // the sheet address lives in wrangler.toml, the passwords are Cloudflare secrets.
  apiBase: typeof location !== 'undefined' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ?'http://localhost:8787/' : 'https://guiden-planung.dan-9d4.workers.dev/',
  refreshMinutes: 5,
  horizonMonths: 2,          // planning further ahead than this is "not fixed yet" (warning); also the calendar feed's range
  showWeeks: 6,              // the app shows this week + this many weeks; the "next 6 weeks" button adds as many again
  hideGuides: ['Martine'],
  // school year this sheet tab belongs to. After `end`, the app shows a reminder to switch to the new
  // tab (gid above) and check the holiday list below. Update all three when the new school year starts.
  schoolYear: { label: '2026/2027', end: '2027-09-14' },
  // school holidays and days off, from men.public.lu/fr/vacances-scolaires.html
  // (règlement grand-ducal du 3 juin 2026). [first day, last day, name]. Saint Nicolas left out: primary schools only.
  holidays: [
    ['2026-10-31','2026-11-08','Allerhellegevakanz'],
    ['2026-12-19','2027-01-03','Chrëschtvakanz'],
    ['2027-02-06','2027-02-14','Fuesvakanz'],
    ['2027-03-27','2027-04-11','Ouschtervakanz'],
    ['2027-05-01','2027-05-01','1. Mee'],
    ['2027-05-06','2027-05-06','Christi Himmelfaart'],
    ['2027-05-17','2027-05-17','Péngschtméindeg'],
    ['2027-05-29','2027-06-06','Péngschtvakanz'],
    ['2027-06-23','2027-06-23','Nationalfeierdag'],
    ['2027-07-16','2027-09-14','🏖️ Summervakanz'],
    ['2027-10-30','2027-11-07','Allerhellegevakanz'],
    ['2027-12-18','2028-01-02','Chrëschtvakanz'],
    ['2028-02-12','2028-02-20','Fuesvakanz'],
    ['2028-04-01','2028-04-16','Ouschtervakanz'],
    ['2028-04-17','2028-04-17','Ouschterméindeg'],
    ['2028-05-01','2028-05-01','1. Mee'],
    ['2028-05-09','2028-05-09','Europadag'],
    ['2028-05-25','2028-05-25','Christi Himmelfaart'],
    ['2028-05-27','2028-06-04','Péngschtvakanz'],
    ['2028-06-05','2028-06-05','Péngschtméindeg'],
    ['2028-06-23','2028-06-23','Nationalfeierdag'],
    ['2028-07-14','2028-09-14','🏖️ Summervakanz'],
    ['2028-10-28','2028-11-05','Allerhellegevakanz'],
    ['2028-12-16','2028-12-31','Chrëschtvakanz'],
    ['2029-01-01','2029-01-01','Neijoerschdag'],
    ['2029-02-10','2029-02-18','Fuesvakanz'],
    ['2029-03-31','2029-04-15','Ouschtervakanz'],
    ['2029-05-01','2029-05-01','1. Mee'],
    ['2029-05-09','2029-05-09','Europadag'],
    ['2029-05-10','2029-05-10','Christi Himmelfaart'],
    ['2029-05-19','2029-05-27','Péngschtvakanz'],
    ['2029-07-13','2029-09-16','🏖️ Summervakanz']
  ]   // codes found in the sheet that get no button, agenda or team-grid row (case-insensitive)
};

/* ======================= CORE (pure parsing, no DOM) ======================= */
/*CORE-START*/
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const norm=s=>(s||'').toString().trim().toLowerCase();
const cellv=(r,i)=>((r[i]==null?'':r[i])+'').replace(/\s+/g,' ').trim();

function mapColumns(header){
  const find=(re,from)=>{for(let i=from||0;i<header.length;i++) if(re.test(norm(header[i]))) return i; return -1;};
  const c={a:0,conge:1,mobil:2,r1:3,r2:4,r3:5,count:6,g1:7,g2:8,jour:9,date:10,start:11,end:12,thema:13,teacher:14,cycle:15,kids:16,tel:17,extra:18};
  const set=(k,re)=>{const i=find(re);if(i>=0)c[k]=i;};
  set('conge',/^cong/);set('mobil',/naturmobil/);set('r1',/^remarque 1/);set('r2',/^remarque 2/);set('r3',/^remarque 3/);
  set('count',/activit/);set('jour',/^jour/);set('date',/^date/);set('start',/^ufank|^start|^d[eé]but/);set('end',/^enn|^fin$/);
  set('thema',/^thema/);set('teacher',/^titulaire/);set('cycle',/^cycle/);set('kids',/^unzuel|^nombre/);set('tel',/^telefon|^t[eé]l/);
  const g=find(/^guide/);
  if(g>=0){c.g1=g;const g2=find(/^guide/,g+1);if(g2>=0)c.g2=g2;}
  return c;
}

function times(startS,endS){
  const pick=s=>{const out=[];const re=/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/gi;let m;while((m=re.exec(s||''))){out.push(String(m[1]).padStart(2,'0')+':'+(m[2]||'00'));}return out;};
  const a=pick(startS),b=pick(endS);
  return {start:a[0]||'',end:b[0]||a[1]||''};
}
const isStatus=l=>/planning|plang|datum|period|dates confirm|provisoresch|expobooking|^egal$/i.test(l)||/^\d{1,2}[\/.]\d{1,2}\s*:/.test(l);
const cleanTitle=t=>t.replace(/\s+\d.*$/,'').replace(/[*]+/g,'').trim()||t;
const isCode=v=>/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.\-]{1,14}$/.test(v)&&!/^(op|of|of\/op|cong[eé])$/i.test(v);
const MARKER=/^(of\s*\/\s*op\w*|ofriichten|opriichten)\b[\s,:;-]*/i;
// team meetings, trainings etc. (in Thema or in a Remarque column) become calendar events
const MEET=/r[eé]union|reunioun|versammlung|sitzung|meeting|\bteams\b|teambuilding|formation|klausur|besprech/i;
const ALLDAY=/ganz(en)?\s*dag|ganzen\s*tag|journ[eé]e\s*enti[eè]re|toute\s*la\s*journ[eé]e/i;
const CLOCK=/\b\d{1,2}\s*h\s*\d{0,2}\b|\b\d{1,2}:\d{2}\b/i; // a real clock time (not a date like 10.09)
// a meeting with Isabelle or Kim where no guide is named is only for SA and AL
const WITH_BOSS=/\b(isabelle|kim)\b/i, BOSS_CODES=['sa','al'];
// emoji per activity (Thema), German and French titles
const THEMA_ICONS=[[/trick|astuce/i,'🪄'],[/\barme\b|\bbras\b/i,'💪'],[/verschiedene\w*\s+tiere/i,'🐻'],[/tiergewimmel/i,'🦁'],[/\bluca\b/i,'🦠']];
const themaIcon=t=>{const x=THEMA_ICONS.find(([re])=>re.test(t||''));return x?x[1]+' ':'';};
const TIME_RE=/\b\d{1,2}\s*(?:h|:)\s*\d{0,2}(?:\s*[-–]\s*\d{1,2}\s*(?:h|:)\s*\d{0,2})?\s*:?/gi;

function buildModel(rows,hide){
  const hidden=new Set((hide||[]).map(h=>h.toLowerCase()));
  const C=mapColumns(rows[0]||[]);
  const rowGuides=r=>{const out=[];for(const k of ['g1','g2']){const v=cellv(r,C[k]);if(v&&isCode(v)&&!out.includes(v))out.push(v);}return out;};
  // pass 1: which guide codes exist (canonical spelling = most frequent)
  const counts={};
  for(let i=1;i<rows.length;i++){ if(!/\d{1,2}\/\d{1,2}\/\d{4}/.test(cellv(rows[i],C.date)) && !cellv(rows[i],C.start)) continue;
    for(const g of rowGuides(rows[i])){const k=g.toLowerCase();(counts[k]=counts[k]||{})[g]=(counts[k][g]||0)+1;} }
  const canon={},total={};
  for(const k in counts){const forms=Object.entries(counts[k]).sort((a,b)=>b[1]-a[1]);canon[k]=forms[0][0];total[k]=Object.values(counts[k]).reduce((a,b)=>a+b,0);}
  // hidden codes stay "known" (so their sessions, congé and remarks are not mistaken for team-wide or another guide's),
  // they are only left out of the visible guide list
  const guides=Object.keys(canon).filter(k=>!hidden.has(k)).sort((a,b)=>total[b]-total[a]).map(k=>canon[k]);
  const known=new Set(Object.keys(canon));

  const parseRemark=t=>{ // leading guide codes => personal note
    const toks=t.split(/[\s,+/&:;]+/).filter(Boolean);const codes=[];let n=0;
    for(const tok of toks){const l=tok.toLowerCase();
      if(known.has(l)){codes.push(canon[l]);n++;}
      else if(tok.length===1&&codes.length){const m=[...known].filter(k=>k[0]===l);if(m.length===1){codes.push(canon[m[0]]);n++;}else break;}
      else break;}
    return {codes,text:t,rest:toks.slice(n).join(' ')};
  };
  // "Sa 8h30-16h30 Formation handicap", "10h30 Sa Réunion FNR", "Reunioun Kim" -> {start,end,title,codes}
  const meeting=t=>{const tm=times(t,'');const noTime=t.replace(TIME_RE,' ').replace(/\s+/g,' ').trim();
    const p=parseRemark(noTime);let codes=p.codes;
    if(!codes.length&&WITH_BOSS.test(noTime))codes=BOSS_CODES.filter(c=>known.has(c)).map(c=>canon[c]);
    const ti=((p.codes.length?p.rest:noTime)||t).replace(/\s+([,;.])/g,'$1');
    return {start:tm.start,end:tm.end,title:ti[0].toUpperCase()+ti.slice(1),codes};};
  // CET = time off taken from accumulated overtime (still absent); TT = télétravail (working, not absent)
  const kindOf=x=>{const c=x.text;
    if(/^tt\b|t[eé]l[eé]\s*-?\s*travail|home\s*office/i.test(c))return {...x,kind:'tt',text:'Teletravail'+c.replace(/^tt\b|t[eé]l[eé]\s*-?\s*travail|home\s*office/i,'')};
    if(/^cet\b/i.test(c))return {...x,kind:'cet',text:c.replace(/^cet\b/i,'CET')+' (Iwwerstonnen)'};
    return {...x,kind:'off'};};
  const parseConge=t=>{const m=/^([A-Za-zÀ-ÿ]{2,15})\s+(.+)$/.exec(t);
    if(m&&known.has(m[1].toLowerCase()))return kindOf({code:canon[m[1].toLowerCase()],text:m[2]});
    if(known.has(t.toLowerCase()))return kindOf({code:canon[t.toLowerCase()],text:'Congé'});
    return kindOf({code:null,text:t});};

  const days=new Map(),placements=[{lines:[]}];
  let pi=0,cur=null,sawDate=false,lastG=[];
  const dayOf=d=>{if(!days.has(d))days.set(d,{date:d,pl:pi,sessions:[],events:[],notes:[],pnotes:[],conge:[],logi:[],setup:false,teardown:false});return days.get(d);};

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const dm=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(cellv(r,C.date));
    if(dm){const d=`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;if(d!==cur){cur=d;lastG=[];}sawDate=true;}
    if(!sawDate)continue;

    let thema=cellv(r,C.thema),isMarker=false,cutNow=false,cutAfter=false,setup=false,teardown=false;
    const mk=MARKER.exec(thema);
    if(mk){isMarker=true;const w=mk[1].toLowerCase();
      if(/^of\s*\/\s*op/.test(w)){cutNow=true;setup=true;teardown=true;}
      else if(w==='ofriichten'){cutAfter=true;teardown=true;}
      else setup=true;
      thema=thema.slice(mk[0].length).trim();}
    if(cutNow){placements.push({lines:[]});pi=placements.length-1;}
    const a=cellv(r,C.a);
    if(a)placements[pi].lines.push(a);

    const day=dayOf(cur);
    if(setup)day.setup=true;
    if(teardown)day.teardown=true;

    const own=rowGuides(r);
    if(own.length)lastG=own;
    const t=times(cellv(r,C.start),cellv(r,C.end));
    const teacher=cellv(r,C.teacher),cycle=cellv(r,C.cycle),kids=cellv(r,C.kids);

    const cg=cellv(r,C.conge);
    if(cg){const c=parseConge(cg);if(!day.conge.some(x=>x.code===c.code&&x.text===c.text))day.conge.push(c);}
    for(const k of ['r1','r2','r3']){const rt=cellv(r,C[k]);if(!rt)continue;
      if(MEET.test(rt)){const mt=meeting(rt);day.events.push({start:mt.start,end:mt.end,title:mt.title,guides:mt.codes,allDay:!mt.start,meet:true});continue;}
      if(CLOCK.test(rt)){const mt=meeting(rt);if(mt.start){day.events.push({start:mt.start,end:mt.end,title:mt.title,guides:mt.codes,appt:true});continue;}} // "Sa 9h00 Florence" -> appointment
      const p=parseRemark(rt);
      // Remarque 3 starting with guide code(s), e.g. "Pa planetarium": a meeting for only that guide (all day)
      if(k==='r3'&&p.codes.length&&p.rest){day.events.push({start:'',end:'',title:p.rest[0].toUpperCase()+p.rest.slice(1),guides:p.codes,allDay:true,meet:true});continue;}
      if(p.codes.length)day.pnotes.push(p);else day.notes.push(rt);}
    const mob=cellv(r,C.mobil);if(mob)day.logi.push(mob);

    if(isMarker){ if(thema)day.notes.push(thema); }
    else if((teacher||cycle||kids)&&t.start){
      day.sessions.push({start:t.start,end:t.end,thema,teacher,cycle,kids,tel:cellv(r,C.tel),extra:cellv(r,C.extra),guides:own.length?own:lastG});
    } else if(thema||(t.start&&cellv(r,C.start).length>5)){
      let title=thema||cellv(r,C.start),st=t.start,en=t.end;
      const lead=/^\s*(\d{1,2})\s*[h:]\s*(\d{2})?\s*[:\-–]?\s*/.exec(title); // "13h45: Reunioun Éislek a Guttland"
      if(!st&&lead&&title.length>lead[0].length){st=lead[1].padStart(2,'0')+':'+(lead[2]||'00');title=title.slice(lead[0].length);}
      const meet=MEET.test(title),allDay=!st&&(meet||ALLDAY.test(cellv(r,C.start)))&&(meet||!!thema);
      if(st||allDay)day.events.push({start:st,end:en,title,guides:own,allDay,meet});
      else day.notes.push(title);
    }
    if(cutAfter){placements.push({lines:[]});pi=placements.length-1;}
  }
  for(const p of placements){
    const ls=p.lines.filter(l=>!/_|trimester/i.test(l)&&!isStatus(l)&&!/^\d{1,3}$/.test(l));
    p.title=ls[0]?cleanTitle(ls[0]):'';
    p.info=ls.slice(1);
  }
  const list=[...days.values()].sort((x,y)=>x.date<y.date?-1:1);
  return {days:list,placements,guides};
}
/* Coordinates in an address: "49°48'52.3"N 6°25'22.6"E", "49.81453, 6.42294" or a Google Maps link (@lat,lon / q=lat,lon).
   Returns {lat, lon} (decimal degrees) or null. Used by the app (navigation) and the calendar feed (GEO / LOCATION). */
function coords(text){
  const t=String(text||'').replace(/[′’‘`]/g,"'").replace(/[″“”]/g,'"').replace(/''/g,'"');
  const ok=(lat,lon)=>Math.abs(lat)<=90&&Math.abs(lon)<=180?{lat:+lat.toFixed(6),lon:+lon.toFixed(6)}:null;
  const part=/(\d{1,3})\s*°\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*'\s*)?(?:(\d{1,2}(?:[.,]\d+)?)\s*"\s*)?/.source;
  const dms=new RegExp(part+/([NSns])[\s,;]*/.source+part+/([EWOewo])/.source).exec(t);
  if(dms){const v=(d,m,sec)=>+d+(+(m||'0').replace(',','.'))/60+(+(sec||'0').replace(',','.'))/3600;
    let lat=v(dms[1],dms[2],dms[3]),lon=v(dms[5],dms[6],dms[7]);
    if(/s/i.test(dms[4]))lat=-lat; if(/w/i.test(dms[8]))lon=-lon; return ok(lat,lon);}
  const dec=/(?:^|[@=\s(:])(-?\d{1,2}\.\d{3,})\s*[,;]\s*(-?\d{1,3}\.\d{3,})/.exec(t);
  return dec?ok(+dec[1],+dec[2]):null;
}
/* Appointments and meetings edited in the app (stored by the worker, shared by everyone):
   {id, ref, date, start, end, allDay, title, guides, meet, deleted, by, at}
   ref = evKey of the sheet event it changes ('' = added in the app). If the sheet later changes that event,
   ref no longer matches and the sheet version shows again: the sheet still wins. guides [] = everyone. */
const evKey=(date,e)=>[date,e.start||'',String(e.title||'').trim().toLowerCase()].join('|');
function applyEdits(model,edits){
  const list=Object.values(edits||{});
  const days=new Map(model.days.map(d=>[d.date,{...d,events:[]}]));
  const dayAt=date=>{if(!days.has(date)){const prev=[...days.keys()].filter(k=>k<date).sort().pop();
    days.set(date,{date,pl:prev?days.get(prev).pl:0,sessions:[],events:[],notes:[],pnotes:[],conge:[],logi:[],setup:false,teardown:false});}
    return days.get(date);};
  const byRef={};for(const x of list)if(x.ref)byRef[x.ref]=x;
  const mk=(x,base)=>({...(base||{}),start:x.allDay?'':x.start||'',end:x.allDay?'':x.end||'',allDay:!!x.allDay||!x.start,
    title:x.title,guides:x.guides||[],meet:!!x.meet,appt:!x.meet,edit:x});
  for(const d of model.days)for(const e of d.events){const k=evKey(d.date,e),x=byRef[k];
    if(!x){days.get(d.date).events.push({...e,key:k});continue;}
    if(!x.deleted)dayAt(x.date).events.push({...mk(x,e),key:k});}
  for(const x of list)if(!x.ref&&!x.deleted&&x.date)dayAt(x.date).events.push({...mk(x),key:'x'+x.id});
  const at=e=>e.allDay?'':e.start||'99';
  for(const d of days.values())d.events.sort((a,b)=>at(a)<at(b)?-1:at(a)>at(b)?1:0);
  return {...model,days:[...days.values()].sort((a,b)=>a.date<b.date?-1:1)};
}

// last visible date: today + horizonMonths, moved to the Sunday of that week
function horizonEnd(){
  if(!CONFIG.horizonMonths)return '9999-12-31';
  const d=new Date();d.setHours(12,0,0,0);const day=d.getDate();
  d.setMonth(d.getMonth()+CONFIG.horizonMonths);if(d.getDate()!==day)d.setDate(0); // 31 Dec + 2 → 28/29 Feb, not 3 Mar
  return addDays(mondayOf(ymd(d)),6);
}

  render();
}
// shown period: this week + showWeeks weeks, plus showWeeks more for each tap on "next 6 weeks" (S.more)
const viewEnd=more=>addDays(mondayOf(ymd(new Date())),7*CONFIG.showWeeks*(1+more)+6);
// S.model = S.full cut at the end of the shown period
function applyLimit(){
  S.limit=viewEnd(S.more||0);
  S.model={...S.full,days:S.full.days.filter(d=>d.date<=S.limit)};
}
const moreBtn=()=>S.lastDay>S.limit?`<button class="past" id="more">Déi nächst ${CONFIG.showWeeks} Wochen weisen (bis ${fmtShort(addDays(viewEnd((S.more||0)+1),-2))})</button>`:'';
const weekDays=(m,wk)=>m.days.filter(d=>d.date>=wk&&d.date<=addDays(wk,4));
const teamOff=day=>day.conge.some(c=>!c.code);
const holiday=ds=>{const h=(CONFIG.holidays||[]).find(([a,b])=>ds>=a&&ds<=b);return h?h[2]:'';};
// name of the school holiday if all of Mon-Fri are holiday AND the sheet has no class that week, else ''.
// The sheet always wins: any session in the week means it is shown normally, without a holiday banner.
// Meetings can still happen in the holidays (summer): they are shown under the banner.
const holidayWeek=wk=>{const n=[0,1,2,3,4].map(i=>holiday(addDays(wk,i)));if(!n.every(Boolean))return '';
  if(S.full&&weekDays(S.full,wk).some(d=>d.sessions.length))return '';
  return [...new Set(n)].join(' / ');};
// a week whose planning is not finished: no session with a guide yet, and not a holiday/day-off on every weekday
const unfinished=wk=>{const ds=weekDays(S.full,wk);
  if(ds.some(d=>d.sessions.some(s=>s.guides.length)))return false;
  const off=[0,1,2,3,4].filter(i=>{const x=addDays(wk,i);return (holiday(x)&&!ds.some(d=>d.date===x&&d.sessions.length))||ds.some(d=>d.date===x&&teamOff(d));}).length;
  return off<5;};
const NOT_DONE=`<div class="notice">D’Planung fir dës Woch ass nach net fäerdeg.</div>`;
const HOL_NOTE=n=>`<div class="notice hol">Schoulvakanz: ${esc(n)}</div>`;
const NOT_FIX=`<div class="notice warn">Méi wéi ${CONFIG.horizonMonths} Méint am Viraus: dës Planung ass nach net fix a kann nach änneren.</div>`;
function setStatus(){
  const el=$('#status');const f=S.fetchedAt?new Date(S.fetchedAt):null;const t=f?`${f.getDate()}. ${MS[f.getMonth()]}, ${pad(f.getHours())}:${pad(f.getMinutes())}`:'nie';
  el.textContent=S.offline?`Offline – gespäichert Donnéeën vum ${t}`:`Aktualiséiert: ${t}`;el.className=S.offline?'off':'';
}

function dayFor(day,g){
  const gl=g.toLowerCase(),has=a=>a.some(x=>x.toLowerCase()===gl);
  const s=day.sessions.filter(x=>has(x.guides));
  const ev=day.events.filter(e=>!e.guides.length||has(e.guides));
  const pn=day.pnotes.filter(p=>has(p.codes));
  const cg=day.conge.filter(c=>!c.code||c.code.toLowerCase()===gl);
  const mine=s.length>0||pn.length>0||cg.some(c=>c.code)||ev.length>0; // team meetings (no guide named) are for everyone
  return {s,ev,pn,cg,mine};
}
const siteOf=(m,day)=>(m.placements[day.pl]&&m.placements[day.pl].title)||'';
const matchQ=(x,q)=>!q||JSON.stringify(x).toLowerCase().includes(q);

function sessHtml(x){
  const bits=[];
  if(x.cycle)bits.push(`<b>${esc(x.cycle)}</b>`);
  if(x.kids)bits.push(esc(x.kids)+' Kanner');
  let phone='',lang='';
  if(x.tel){if(isPhone(x.tel))phone=x.tel;else lang=x.tel;}
  if(lang)bits.push(esc(lang));
  return `<div class="sess"><div class="time">${esc(x.start)}<span>${esc(x.end)}</span></div><div>
    <div class="thema">${themaIcon(x.thema)}${esc(x.thema||'Aktivitéit')}</div>
    <div class="meta">${bits.join(' · ')}</div>
    ${x.teacher?`<div class="teach">${linkify(x.teacher)}</div>`:''}
    ${phone?`<div class="teach">📞 ${linkify(phone)}</div>`:''}
    ${x.extra?`<div class="note">${linkify(x.extra)}</div>`:''}
  </div></div>`;
}
function dayHtml(m,day,g,today){
  const d=dayFor(day,g),site=siteOf(m,day);
  const teamOn=d.mine||day.sessions.length>0;
  const hasSess=d.s.length>0;
  const leave=d.cg.length>0;
  const q=S.q;
  const free=!d.mine&&!leave;
  let h=`<div class="day ${day.date===today?'today':''} ${free?'free':''} ${day.date<today?'done':''}"><div class="dh"><b>${fmtDay(day.date)}</b><span>`;
  const place=hasSess&&site&&placeOf(site);
  if(hasSess&&site)h+=`<span class="site">${esc(site)}</span>${place?`<a class="navbtn go" data-a="${esc(place.a)}" data-s="${esc(site)}" href="${esc(navUrl(place.a))}"${navTarget()} aria-label="Navigatioun op ${esc(site)}">${GPS_ICON}Navi</a>`:`<button class="pin" data-site="${esc(site)}" title="Adress derbäisetzen">📍 Adress?</button>`}`;
  for(const c of d.cg)h+=`<span class="tag${c.kind==='tt'?'':' warn'}">${c.kind==='tt'?'🏠 ':''}${esc(c.text)}</span>`;
  if(holiday(day.date)&&!day.sessions.length)h+=`<span class="tag">${esc(holiday(day.date))}</span>`;
  if(day.setup&&teamOn)h+=`<span class="tag">Opriichten</span>`;
  if(day.teardown&&teamOn)h+=`<span class="tag">Ofriichten</span>`;
  h+=`</span></div>`;
  if(place)h+=`<div class="addr">📍 ${esc(place.a)}<button class="link" data-site="${esc(site)}" title="Adress änneren">änneren</button></div>`;
  if(free){return h+`<div class="meta">${day.sessions.length?'Net agedeelt':'–'}</div></div>`;}
  for(const x of d.s.filter(x=>matchQ(x,q)))h+=sessHtml(x);
  for(const e of d.ev){const who=e.guides.length?e.guides.join(', '):'';
    const by=e.edit?(e.edit.ref?'geännert':'derbäigesat')+' vum '+e.edit.by:'';
    h+=`<div class="ev${e.meet?' meet':''}"><div class="evrow"><span class="t"><b>${e.allDay?'Ganzen Dag':esc(e.start)+(e.end&&e.end!==e.start?'–'+esc(e.end):'')}</b> ${e.meet?'👥 ':''}${esc(e.title)}${who&&!(who.toLowerCase()===g.toLowerCase())?` <span class="evby">(${esc(who)})</span>`:''}${by?`<br><span class="evby">${esc(by)}</span>`:''}</span><button class="evedit" data-ev="${esc(e.key)}" data-date="${day.date}" title="Änneren" aria-label="Änneren">✎</button></div></div>`;}
  const notes=[...d.pn.map(p=>p.text),...(teamOn?day.notes:[]),...(teamOn?day.logi:[])];
  if(notes.length)h+=`<div class="notes">${notes.map(n=>`<div>• ${linkify(n)}</div>`).join('')}</div>`;
  const pl=m.placements[day.pl];
  if(hasSess&&pl&&pl.info.length)h+=`<details><summary>Kontakt &amp; Zougang um Site</summary>${pl.info.map(l=>`<div>${linkify(l)}</div>`).join('')}</details>`;
  return h+`</div>`;
}

// "add my calendar to the phone": subscribe links for the selected guide's feed
// the feed link contains the guide's own password, so it is only offered for the logged-in guide
const icsUrl=()=>S.pw?CONFIG.apiBase+'cal/'+encodeURIComponent(S.pw)+'.ics':'';
function calBlock(g){
  if(!S.me||g.toLowerCase()!==S.me.toLowerCase())return '';
  const u=icsUrl();if(!u)return '';
  const webcal=u.replace(/^https?:/,'webcal:');
  const google='https://calendar.google.com/calendar/render?cid='+encodeURIComponent(webcal);
  return `<details class="cal"><summary>📅 Mäi Kalenner op den Handy (${esc(g)})</summary>
    <div class="calbtns"><a class="icon" href="${esc(webcal)}">iPhone / Outlook: abonnéieren</a>
    <a class="icon" href="${esc(google)}" target="_blank" rel="noopener">Android / Google Kalenner</a>
    <button class="icon" id="copyics" data-u="${esc(u)}">Link kopéieren</button></div>
    <div class="meta">Eemol abonnéieren: de Kalenner aktualiséiert sech dann eleng (meeschtens all puer Stonnen). Weist déi nächst ${CONFIG.horizonMonths} Méint, ouni Garantie: kuck am Zweifel hei an der App.</div></details>`;
}
function renderAgenda(){
  const m=S.model,g=S.guide,today=ymd(new Date());
  if(!g){return `<div class="empty">Wiel uewen däi Kürzel, fir däin Agenda ze gesinn.</div>`;}
  const weeks=new Map();
  for(const day of m.days){const dd=dayFor(day,g);
    if(!(dd.mine||day.sessions.length))continue;
    const wk=mondayOf(day.date);if(!weeks.has(wk))weeks.set(wk,{wk,days:new Map(),mine:false});
    const w=weeks.get(wk);w.days.set(day.date,day);if(dd.mine)w.mine=true;}
  const thisWk=mondayOf(today);
  // from this week to the horizon, add weeks whose planning is not finished, so they show a note instead of disappearing
  // holiday weeks show their name instead
  for(let wk=thisWk;wk<=S.limit;wk=addDays(wk,7)){
    const hol=holidayWeek(wk),open=!hol&&unfinished(wk);
    if(hol||open){if(!weeks.has(wk))weeks.set(wk,{wk,days:new Map(),mine:true});const w=weeks.get(wk);w.mine=true;w.open=true;w.hol=hol;w.undone=open;}}
  const all=[...weeks.values()].filter(w=>w.mine).sort((a,b)=>a.wk<b.wk?-1:1);
  const laterBtn=moreBtn();
  if(!all.length)return calBlock(g)+`<button class="addev" id="addev">＋ Termin / Reunioun derbäisetzen</button>`+`<div class="empty">Fir ${esc(g)} ass nach näischt agedroen.</div>`+laterBtn;
  const past=all.filter(w=>addDays(w.wk,6)<today),rest=all.filter(w=>addDays(w.wk,6)>=today);
  const vis=S.showPast?all:rest;
  let h=calBlock(g)+`<button class="addev" id="addev">＋ Termin / Reunioun derbäisetzen</button>`;
  if(past.length&&!S.showPast)h+=`<button class="past" id="showpast">${past.length} vergaange ${past.length>1?'Wochen':'Woch'} weisen</button>`;
  for(const w of vis){
    let bits=[];
    h+=`<div class="wk" data-wk="${w.wk}"><span>Woch ${isoWeek(w.wk)}${w.wk===thisWk?' · dës Woch':''}</span><small>${fmtShort(w.wk)} – ${fmtShort(addDays(w.wk,4))}</small></div>`;
    if(w.wk>S.horizon)h+=NOT_FIX;
    if(w.hol)h+=HOL_NOTE(w.hol);
    else if(w.undone)h+=NOT_DONE;
    for(let i=0;i<7;i++){
      const ds=addDays(w.wk,i);const day=m.days.find(x=>x.date===ds);
      if(!day){ if(i<5&&!w.open)h+=`<div class="day free${ds<today?' done':''}"><div class="dh"><b>${fmtDay(ds)}</b>${holiday(ds)?`<span class="tag">${esc(holiday(ds))}</span>`:''}</div><div class="meta">–</div></div>`; continue;}
      const dd=dayFor(day,g);
      if(i>=5&&!dd.mine)continue;
      if(w.open&&!dd.mine&&!teamOff(day))continue; // unfinished week: only days that carry something (leave, notes for this guide)
      h+=dayHtml(m,day,g,today);
    }
  }
  return h+laterBtn;
}

// team grid: ▶ goes on until the last day in the sheet; past the shown period it opens the next 6 weeks
function renderTeam(){
  const m=S.full,today=ymd(new Date());
  if(!S.week){
    const w=mondayOf(today);S.week=w;
  }
  const wk=S.week;
  let h=`<div class="wkbar"><button class="icon" id="pw">◀</button><b>Woch ${isoWeek(wk)} · ${fmtShort(wk)} – ${fmtShort(addDays(wk,4))}</b><button class="icon" id="nw"${addDays(wk,7)>S.lastDay?' disabled':''}>▶</button></div>`;
  if(holidayWeek(wk))h+=HOL_NOTE(holidayWeek(wk));
  if(wk>S.horizon)h+=NOT_FIX;
  else if(!holidayWeek(wk)&&wk>=mondayOf(today)&&unfinished(wk))h+=NOT_DONE;
  h+=`<table><tr><th class="g"></th>${[0,1,2,3,4].map(i=>`<th>${WDS[i]}<br>${toDate(addDays(wk,i)).getDate()}</th>`).join('')}</tr>`;
  for(const g of m.guides){
    h+=`<tr><td class="g">${esc(g)}</td>`;
    for(let i=0;i<5;i++){
      const ds=addDays(wk,i);const day=m.days.find(x=>x.date===ds);
      let c='–',cls='c';
      if(day){const d=dayFor(day,g);
        const off=d.cg.find(x=>x.code&&x.kind!=='tt'),tt=d.cg.find(x=>x.code&&x.kind==='tt');
        if(off)cls+=' lv',c=esc(off.text);
        else if(tt&&!d.s.length)c='🏠 '+esc(tt.text);
        else if(d.s.length){const st=d.s.map(x=>x.start).sort()[0],en=d.s.map(x=>x.end).sort().slice(-1)[0];c=`<b>${esc(siteOf(m,day)||'?')}</b><br>${d.s.length}× ${esc(st)}–${esc(en)}`;
          const ic=[...new Set(d.s.map(x=>themaIcon(x.thema).trim()).filter(Boolean))].join('');if(ic)c+=`<br>${ic}`;}
        else if(d.ev.length)c=esc(d.ev[0].title);
        else if(d.mine)c='Evenement';
        const mt=d.ev.filter(e=>e.meet);if(d.s.length&&mt.length)c+=`<br>👥 ${esc(mt.map(e=>e.allDay?'Dag':e.start).join(', '))}`;}
      if(c==='–'&&holiday(ds))c=`<span class="meta">${esc(holiday(ds))}</span>`;
      if(g.toLowerCase()===S.guide.toLowerCase())cls+=' me';
      if(ds<today)cls+=' done';
      h+=`<td class="${cls}" data-g="${esc(g)}" data-d="${ds}">${c}</td>`;
    }
    h+='</tr>';
  }
  h+='</table><div class="meta" style="margin-top:8px">Tipp op eng Zell, fir den Agenda vun deem Guide opzemaachen.</div>'+`<button class="addev" id="addev">＋ Termin / Reunioun derbäisetzen</button>`;
  const un=m.days.filter(d=>d.date>=wk&&d.date<=addDays(wk,4)).flatMap(d=>d.sessions.filter(s=>!s.guides.length).map(s=>({d:d.date,s})));
  if(un.length)h+=`<div class="notes"><b>Aktivitéite ouni Guide:</b>${un.map(u=>`<div>• ${fmtDay(u.d)} ${esc(u.s.start)} ${themaIcon(u.s.thema)}${esc(u.s.thema)} ${esc(u.s.cycle)}</div>`).join('')}</div>`;
  return h;
}

// new school year (or holiday list no longer covers the shown period): remind to update the app
function yearReminder(){
  const today=ymd(new Date()),sy=CONFIG.schoolYear||{};
  const lastHol=(CONFIG.holidays||[]).map(h=>h[1]).sort().pop()||'';
  const newYear=sy.end&&today>sy.end,noHol=lastHol<S.horizon;
  if(!newYear&&!noHol)return '';
  return `<div class="notice warn">Erënnerung: ${newYear?`d’Schouljoer ${esc(sy.label)} ass eriwwer. An der App nach déi nei Tabell an `:'An der App nach '}d’Schoulvakanzen fir dat neit Schouljoer androen (men.public.lu/fr/vacances-scolaires.html).</div>`;
}
function render(){
  const m=S.model;if(!m)return;
  document.body.classList.remove('out');
  setStatus();
  $('#chips').innerHTML=m.guides.map(g=>`<button class="chip ${g.toLowerCase()===S.guide.toLowerCase()?'on':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===S.view));
  const y=window.scrollY;
  $('#app').innerHTML=yearReminder()+(S.view==='team'?renderTeam():renderAgenda())+
    (S.me?`<div class="foot">Ugemellt als ${esc(S.me)} · <button class="link" id="logout">Ofmellen</button></div>`:'');
  window.scrollTo(0,y);
}
function scrollToToday(){
  const today=ymd(new Date());const wk=document.querySelector(`.wk[data-wk="${mondayOf(today)}"]`)||document.querySelector('.wk');
  if(wk)wk.scrollIntoView({block:'start'});
}

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){S.guide=chip.dataset.g===S.guide?'':chip.dataset.g;localStorage.setItem('guide',S.guide);if(S.guide&&S.view==='team'&&false){}render();return;}
  const tab=e.target.closest('.tab');
  if(tab){S.view=tab.dataset.v;localStorage.setItem('view',S.view);render();if(S.view==='agenda')scrollToToday();return;}
  if(e.target.id==='refresh'){load(true);return;}
  if(e.target.id==='showpast'){S.showPast=true;render();return;}
  if(e.target.id==='pw'){S.week=addDays(S.week,-7);render();return;}
  if(e.target.id==='nw'){if(addDays(S.week,7)<=S.lastDay){S.week=addDays(S.week,7);
      if(addDays(S.week,4)>S.limit){S.more=(S.more||0)+1;applyLimit();}}render();return;}
  if(e.target.id==='more'){S.more=(S.more||0)+1;applyLimit();render();return;}
  if(e.target.id==='logout'){if(confirm('Op dësem Handy ofmellen?'))logout();return;}
  if(e.target.id==='copyics'){const b=e.target,u=b.dataset.u;
    const ok=()=>{b.textContent='Kopéiert ✓';setTimeout(()=>{b.textContent='Link kopéieren';},2000);};
    if(navigator.clipboard)navigator.clipboard.writeText(u).then(ok,()=>prompt('Link kopéieren:',u));else prompt('Link kopéieren:',u);return;}
  const nb=e.target.closest('.navbtn');
  if(nb&&isIOS){e.preventDefault();navSheet(nb.dataset.a,nb.dataset.s);return;}
  const pe=e.target.closest('[data-site]');
  if(pe){editPlace(pe.dataset.site);return;}
  const ee=e.target.closest('.evedit');
  if(ee){const ev=findEv(ee.dataset.date,ee.dataset.ev);if(ev)evForm(ev,ee.dataset.date);return;}
  if(e.target.id==='addev'){evForm(null,S.view==='team'&&S.week&&S.week>ymd(new Date())?S.week:ymd(new Date()));return;}
  const td=e.target.closest('td.c');
  if(td){S.guide=td.dataset.g;localStorage.setItem('guide',S.guide);S.view='agenda';localStorage.setItem('view','agenda');render();
    const w=document.querySelector(`.wk[data-wk="${mondayOf(td.dataset.d)}"]`);if(w)w.scrollIntoView({block:'start'});}
});
document.addEventListener('submit',e=>{if(e.target.id!=='login')return;e.preventDefault();
  const pw=$('#pw').value.trim();if(!pw)return;
  $('#status').textContent='Umellen…';login(pw);});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false);});
setInterval(()=>{if(!document.hidden)load(true);},CONFIG.refreshMinutes*60000);
load(true).then(()=>{if(S.view==='agenda')scrollToToday();});
</script>
